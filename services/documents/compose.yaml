services:
  documents:
    image: kundexa-documents:2026-10-13
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kundexa:${DOCUMENTS_DB_PASSWORD:?required}@database:5432/documents
      WORKDIR: /data/docuseal
      FORCE_SSL: "true"
      DISABLE_SIGNUP: "true"
    volumes:
      - documents:/data/docuseal
    depends_on:
      database:
        condition: service_healthy
  database:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: kundexa
      POSTGRES_DB: documents
      POSTGRES_PASSWORD: ${DOCUMENTS_DB_PASSWORD:?required}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U kundexa -d documents"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  documents:
  database:
