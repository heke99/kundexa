# Source build pinned to the API implementation audited for this adapter.
# No service is installed or started by adding this file.
services:
  docuseal:
    image: kundexa-docuseal:3c65b0e4ba872fe71d5566c0d09c3ace59a7fb8a
    build:
      context: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      DATABASE_URL: ${DOCUSEAL_DATABASE_URL:?Set a dedicated DocuSeal Postgres connection}
      SECRET_KEY_BASE: ${DOCUSEAL_SECRET_KEY_BASE:?Set a persistent Rails secret}
      ENCRYPTION_SECRET: ${DOCUSEAL_ENCRYPTION_SECRET:?Set a persistent encryption secret}
      FORCE_SSL: "true"
    volumes:
      - docuseal-data:/data/docuseal
volumes:
  docuseal-data:
