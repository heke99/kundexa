# Optional local database on the future Docker host. No public database port.
services:
  docuseal:
    environment:
      DATABASE_URL: postgresql://docuseal:${DOCUSEAL_DB_PASSWORD:?Use a generated hex password}@postgres:5432/docuseal
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_DB: docuseal
      POSTGRES_USER: docuseal
      POSTGRES_PASSWORD: ${DOCUSEAL_DB_PASSWORD:?Use a generated hex password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuseal -d docuseal"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - docuseal-postgres:/var/lib/postgresql/data
volumes:
  docuseal-postgres:
