name: deploy-edge-functions

# An Edge Function is a snapshot of its files taken at deploy time. A change to a
# shared module therefore does not reach production until every function that
# imports it is deployed again — and nothing in the repository makes that gap
# visible, because the repository only describes what *should* be running.
#
# That gap is not hypothetical: production ran a shared provider client from before
# 2026-09-07 for 34 days while the repository, the type check and the whole SQL
# suite were green (FAILURE-0055). This workflow closes it by making the deploy
# follow the merge, so "merged to main" and "running in production" mean the same
# thing for Edge Functions the way they already do for the web app on Vercel.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'scripts/deploy-functions.mjs'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys race for the same function; the later merge wins.
concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A missing credential used to be treated as a setup state: the job skipped,
      # main stayed green, and a warning annotation carried the truth. That was
      # not enough, and the measurement says so. On 2026-09-15, four functions
      # were running older code than main while every check was green:
      #
      #   process-outbox          deployed 09-11 08:14, changed 09-14 17:04
      #   maintenance-worker      deployed 09-10 11:26, changed 09-11 16:36
      #   automation-runner       deployed 09-11 14:56, changed 09-11 16:36
      #
      # One of them carried a contract-delivery fix that had been reported as
      # shipped on the strength of a green Vercel deployment — a different deploy
      # path entirely (FAILURE-0100). A warning nobody reads is indistinguishable
      # from no warning at all.
      #
      # So this now fails. A commit that changes a function and does not deploy it
      # is not a setup state; it is production running code nobody chose. Red here
      # costs five minutes of setup once. The alternative cost 34 days the last
      # time it happened (FAILURE-0055).
      - name: Check deploy credentials
        id: credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::error title=Edge Functions were not deployed::supabase/functions changed but SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF are not set, so production still runs the previous version."
          {
            echo "### Edge Functions were NOT deployed"
            echo
            echo "This commit changed \`supabase/functions/**\`, so production is now"
            echo "running code that is not in main. Set the repository secrets"
            echo "\`SUPABASE_ACCESS_TOKEN\` and \`SUPABASE_PROJECT_REF\` under"
            echo "Settings → Secrets and variables → Actions, then re-run this workflow."
            echo
            echo "This check fails rather than warns because a warning on a green run"
            echo "let four functions drift behind main unnoticed."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Setup Node
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm

      - name: Setup Deno
        if: steps.credentials.outputs.ready == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        if: steps.credentials.outputs.ready == 'true'
        run: npm ci

      # Deploying an Edge Function that does not compile takes the worker down
      # until the next push, so prove it type-checks before it ships.
      - name: Typecheck Edge Functions
        if: steps.credentials.outputs.ready == 'true'
        run: npm run typecheck:edge

      - name: Deploy Edge Functions
        if: steps.credentials.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run functions:deploy -- --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Summarise
        if: steps.credentials.outputs.ready == 'true'
        run: |
          {
            echo "### Edge Functions deployed"
            echo
            echo "Commit \`${GITHUB_SHA}\` is now the source of every deployed function."
          } >> "$GITHUB_STEP_SUMMARY"
