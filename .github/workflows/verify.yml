name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'remediation/**'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Verify generated Supabase types
        run: npm run types:verify

      - name: Typecheck application
        run: npm run typecheck

      - name: Typecheck Edge Functions
        run: npm run typecheck:edge

      - name: Verify migrations and database invariants
        run: node scripts/verify-sql.mjs

      - name: Run regression suite
        run: node scripts/remediation-regression-tests.mjs

      - name: Run contract tests
        run: npm run test:contracts

      - name: Run Rinkel tests
        run: npm run test:rinkel

      - name: Run import tests
        run: npm run test:imports

      - name: Run API tests
        run: npm run test:api

      - name: Verify public OpenAPI coverage
        run: npm run openapi:verify

      - name: Run canonical repository verifier
        run: node scripts/verify.mjs

      - name: Build production bundle
        run: npm run build
