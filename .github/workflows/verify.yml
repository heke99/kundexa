name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'remediation/**'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Verify generated Supabase types
        run: npm run types:verify

      - name: Typecheck application
        run: npm run typecheck

      - name: Typecheck Edge Functions
        run: npm run typecheck:edge

      - name: Verify migrations and database invariants
        run: node scripts/verify-sql.mjs

      - name: Audit fixes and deployed migration profile
        env:
          KUNDEXA_NATIVE_ONLY_MIGRATIONS: '1'
        run: |
          node scripts/audit-call-history-regressions.cjs
          node scripts/audit-context-read-regressions.cjs
          node scripts/audit-recording-boundary.cjs
          node scripts/audit-incoming-regressions.cjs
          node scripts/audit-customer-field-regressions.cjs
          node scripts/audit-product-terms-regressions.cjs
          node scripts/audit-invitation-regressions.cjs
          node scripts/deployment-schema-tests.mjs
          node scripts/audit-approval-readiness.cjs
          node scripts/audit-mfa-regressions.cjs
          node scripts/audit-raw-deletion-regressions.cjs
          node scripts/audit-ftp-compatibility.cjs
          node scripts/audit-native-http-regressions.cjs
          node scripts/audit-network-regressions.cjs
          node scripts/audit-deno-tls-regressions.cjs
          node scripts/audit-password-regressions.cjs
          node scripts/audit-remapping-regressions.cjs
          node scripts/audit-platform-import-regressions.cjs
          node scripts/audit-deploy-regressions.cjs
          node scripts/audit-delivery-regressions.cjs
          node scripts/audit-lifecycle-regressions.cjs
          node scripts/audit-contract-regressions.cjs
          node scripts/audit-runtime-regressions.cjs
          node scripts/audit-access-regressions.mjs

      - name: Run regression suite
        run: node scripts/remediation-regression-tests.mjs

      - name: Run contract tests
        run: npm run test:contracts

      # Mallarna och .docx-läsningen testades lokalt av `npm test` men aldrig i CI.
      - name: Run contract template tests
        run: npm run test:contract-templates

      - name: Run PDF and signing integration tests
        run: |
          npm run test:pdf-fields
          node scripts/native-signing-tests.mjs
          node scripts/native-orchestration-tests.mjs
          node scripts/readiness-tests.mjs
          node scripts/signing-reconcile-tests.mjs
          node scripts/resend-webhook-admin-tests.mjs
          node scripts/remote-signing-parity-tests.mjs

      - name: Run telephony tests
        run: npm run test:telephony

      - name: Run import tests
        run: npm run test:imports

      - name: Run API tests
        run: npm run test:api

      - name: Verify public OpenAPI coverage
        run: npm run openapi:verify

      - name: Run canonical repository verifier
        run: node scripts/verify.mjs

      - name: Build production bundle
        run: npm run build
