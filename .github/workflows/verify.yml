name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "remediation/**"]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify generated Supabase types
        run: npm run types:verify

      - name: Typecheck application
        run: npm run typecheck

      - name: Typecheck Edge Functions
        run: npm run typecheck:edge

      - name: Verify migrations and database invariants
        run: npm run verify-sql

      - name: Run regression suite
        run: npm run test

      - name: Run API regression suite
        run: npm run test:api

      - name: Run import regression suite
        run: npm run test:imports

      - name: Verify public OpenAPI coverage
        run: npm run openapi:verify

      - name: Build production bundle
        run: npm run build

      - name: Run canonical verifier
        run: npm run verify
