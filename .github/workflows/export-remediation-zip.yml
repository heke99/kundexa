name: Export remediation ZIP

on:
  push:
    branches:
      - remediation/canonical-user-provisioning-2026-08-10

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build changed-files ZIP
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          rm -rf /tmp/kundexa-remediation-files
          mkdir -p /tmp/kundexa-remediation-files
          while IFS= read -r -d '' file; do
            case "$file" in
              .github/workflows/export-remediation-zip.yml) continue ;;
            esac
            mkdir -p "/tmp/kundexa-remediation-files/$(dirname "$file")"
            cp "$file" "/tmp/kundexa-remediation-files/$file"
          done < <(git diff --diff-filter=AM --name-only -z origin/main...HEAD)
          cd /tmp
          zip -qr "$GITHUB_WORKSPACE/kundexa-canonical-provisioning-remediation-2026-08-10.zip" kundexa-remediation-files
          unzip -t "$GITHUB_WORKSPACE/kundexa-canonical-provisioning-remediation-2026-08-10.zip"

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kundexa-canonical-provisioning-remediation-2026-08-10
          path: kundexa-canonical-provisioning-remediation-2026-08-10.zip
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary exporter
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/export-remediation-zip.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove temporary remediation ZIP exporter'
          git push origin HEAD:remediation/canonical-user-provisioning-2026-08-10
