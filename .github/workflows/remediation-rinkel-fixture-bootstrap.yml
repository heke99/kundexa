name: Apply Rinkel fixture correction

on:
  push:
    branches:
      - remediation/canonical-user-provisioning-2026-08-10

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixture patch and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          test -f .remediation-bootstrap/rinkel-fixture.patch
          git apply --check .remediation-bootstrap/rinkel-fixture.patch
          git apply .remediation-bootstrap/rinkel-fixture.patch
          git diff --check
          rm -rf .remediation-bootstrap
          rm -f .github/workflows/remediation-rinkel-fixture-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: give Rinkel seller an explicit primary team'
          git push origin HEAD:remediation/canonical-user-provisioning-2026-08-10
