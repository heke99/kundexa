name: document engine build and boot
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['services/documents/**', '.github/workflows/documents-build.yml']
permissions:
  contents: read
jobs:
  document-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build ported document engine
        run: sh services/documents/build.sh
      - name: Boot isolated document engine
        shell: bash
        run: |
          docker network create kundexa-documents-check
          docker run -d --name documents-db --network kundexa-documents-check -e POSTGRES_USER=kundexa -e POSTGRES_DB=documents -e POSTGRES_PASSWORD=isolated-ci-only postgres:17
          for attempt in {1..30}; do
            if docker exec documents-db pg_isready -U kundexa -d documents; then break; fi
            sleep 2
          done
          docker run -d --name documents --network kundexa-documents-check -p 127.0.0.1:3100:3000 \
            -e DATABASE_URL=postgresql://kundexa:isolated-ci-only@documents-db:5432/documents \
            -e SECRET_KEY_BASE=isolated-ci-secret-key-base-not-used-in-production-0123456789abcdef \
            -e KUNDEXA_DOCUMENTS_SECRET=isolated-ci-documents-secret-at-least-32-characters \
            -e KUNDEXA_DOCUMENTS_ADMIN_EMAIL=documents-ci@example.test \
            -e KUNDEXA_DOCUMENTS_ADMIN_PASSWORD=isolated-ci-admin-password-32-characters \
            -e KUNDEXA_DOCUMENTS_API_KEY=isolated-ci-api-key-at-least-32-characters \
            -e KUNDEXA_APP_ORIGIN=https://www.kundexa.se -e APP_URL=http://localhost:3100 \
            -e FORCE_SSL=false -e DISABLE_SIGNUP=true kundexa-documents:2026-10-13
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3100/up >/dev/null; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:3100/up
          docker exec documents /app/bin/rails runner /app/lib/kundexa/bootstrap.rb
          curl --fail --silent -H 'X-Auth-Token: isolated-ci-api-key-at-least-32-characters' http://127.0.0.1:3100/api/templates
          docker exec documents /app/bin/rails zeitwerk:check
      - name: Container diagnostics
        if: failure()
        run: docker logs documents
